# SARA web app on Cloud Run (built by client/cloudbuild.yaml): the static SPA only.
# The app calls the API service directly at VITE_API_URL, so unlike nginx.conf there is no /api proxy
# (and no `server` host to resolve). The API's CLIENT_URL must list this service's URLs.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # The API is a separate service: never answer /api/ with the SPA.
  location /api/ {
    return 404;
  }

  # Hashed Vite bundles never change.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
