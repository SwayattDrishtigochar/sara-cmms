<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shopfloor Digital Twin</title>
<style>
  :root { --bg: #e9ecef; --muted: #5b6168; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden;
    font: 13px/1.4 system-ui, "Segoe UI", Roboto, sans-serif; }
  body.transparent { background: transparent; }
  #shopfloor { position: fixed; inset: 0; }
  #shopfloor canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); pointer-events: none; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="shopfloor"></div>
<div id="loading">Loading 3D scene</div>

<script type="module">
/*
  Shopfloor digital twin: 3D scene only. No UI overlays; the development team attaches cards,
  labels and panels through the API below.

  URL params
    layout=../layout.json      machine list, model paths, camera
    simulate=0                 disable demo motion (machines stay at rest until data arrives)
    transparent=1              transparent canvas for compositing over a page background
    autoHighlight=0            do not pulse the status ring of a clicked machine
    origins=https://a,https://b  allowed postMessage origins (default: same origin only)

  JS API: window.shopfloor (also resolved by the 'shopfloor:ready' event)
    machines                          array of machine ids
    getMachine(id)                    { id, type, state, root, nodes, userData }
    setState(id, state)               RUNNING | IDLE | STOPPED | ALARM | MAINTENANCE | OFFLINE
    apply(id, payload)                live data, same payloads as the single-machine viewers
    focus(id) / resetView()           animated camera moves
    highlight(id | null)              pulse a machine's status ring
    getAnchor(id)                     { x, y, visible } CSS px inside the canvas, for overlay labels
    project([x, y, z])                world point -> { x, y, visible }
    onFrame(cb)                       cb() after every rendered frame (returns an unsubscribe fn)
    dispose()                         free all GPU resources

  DOM events on window
    shopfloor:ready   detail { machines }
    shopfloor:select  detail { id, type, part, role, dataTag, x, y }   (id null = empty click)
    shopfloor:hover   detail { id, part }                              (only when it changes)

  postMessage
    { type: 'shopfloor', id: 'CNC-01', payload: {...} }
    { type: 'shopfloor', updates: [ { id, payload }, ... ] }
*/
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const params = new URLSearchParams(location.search);
const LAYOUT_URL = new URL(params.get('layout') || '../layout.json', location.href);
const SIMULATE = params.get('simulate') !== '0';
const TRANSPARENT = params.get('transparent') === '1';
const AUTO_HIGHLIGHT = params.get('autoHighlight') !== '0';
const ALLOWED_ORIGINS = (params.get('origins') || '').split(',').map(s => s.trim()).filter(Boolean);
const THREE_VERSION = '0.170.0';

// ------------------------------------------------------------------ renderer / scene
const container = document.getElementById('shopfloor');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: TRANSPARENT, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.75));   // large scene: slightly lower DPR cap
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;                               // static shadows, refreshed on demand
container.appendChild(renderer.domElement);
if (TRANSPARENT) document.body.classList.add('transparent');

const scene = new THREE.Scene();
scene.background = TRANSPARENT ? null : new THREE.Color(0xe9ecef);
const pmrem = new THREE.PMREMGenerator(renderer);
const envTex = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environment = envTex;
scene.environmentIntensity = 0.85;
pmrem.dispose();

const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.position.set(-12, 24, 16);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -26, right: 26, top: 22, bottom: -22, near: 1, far: 80 });
sun.shadow.camera.updateProjectionMatrix();          // required after changing frustum bounds
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.03;
scene.add(sun, sun.target);

const camera = new THREE.PerspectiveCamera(32, 1, 0.5, 250);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.47;
controls.minDistance = 3;
controls.maxDistance = 70;
controls.addEventListener('change', () => {          // keep the pivot inside the hall
  controls.target.x = THREE.MathUtils.clamp(controls.target.x, -17, 17);
  controls.target.z = THREE.MathUtils.clamp(controls.target.z, -9.5, 9);
  controls.target.y = THREE.MathUtils.clamp(controls.target.y, 0, 4);
});

// Laptop touchpads: a two-finger scroll walks across the floor (forward/back, left/right) instead of zooming
// into the screen centre. Pinch (ctrl + wheel) and mouse-wheel notches zoom toward the point under the cursor.
controls.zoomToCursor = true;
controls.screenSpacePanning = false;                 // right-drag / two-finger drag pans along the floor
const walkFwd = new THREE.Vector3(), walkRight = new THREE.Vector3(), walkStep = new THREE.Vector3();
const walkFrom = new THREE.Vector3();
let touchpadUntil = 0;                               // one gesture stays a walk even when a flick sends big deltas
renderer.domElement.addEventListener('wheel', (e) => {
  if (e.ctrlKey) return;                             // pinch: OrbitControls zooms to the cursor
  const looksTouchpad = e.deltaMode === 0 && (e.deltaX !== 0 || !Number.isInteger(e.deltaY) || Math.abs(e.deltaY) < 50);
  if (looksTouchpad) touchpadUntil = e.timeStamp + 300;
  if (e.timeStamp > touchpadUntil) return;           // mouse wheel: OrbitControls zooms to the cursor
  e.preventDefault();
  e.stopImmediatePropagation();                      // capture listener runs first, so OrbitControls does not zoom too
  fly = null;
  const k = camera.position.distanceTo(controls.target) * 0.0008;   // farther away = bigger steps
  camera.getWorldDirection(walkFwd); walkFwd.y = 0; walkFwd.normalize();
  walkRight.crossVectors(walkFwd, camera.up).normalize();
  walkStep.copy(walkFwd).multiplyScalar(-e.deltaY * k).addScaledVector(walkRight, e.deltaX * k);
  walkFrom.copy(controls.target);
  controls.target.add(walkStep);
  controls.target.x = THREE.MathUtils.clamp(controls.target.x, -17, 17);
  controls.target.z = THREE.MathUtils.clamp(controls.target.z, -9.5, 9);
  camera.position.add(walkStep.subVectors(controls.target, walkFrom));   // camera moves exactly as far as the pivot
  controls.update();
}, { passive: false, capture: true });

const draco = new DRACOLoader().setDecoderPath(
  `https://cdn.jsdelivr.net/npm/three@${THREE_VERSION}/examples/jsm/libs/draco/gltf/`);
const loader = new GLTFLoader().setDRACOLoader(draco).setMeshoptDecoder(MeshoptDecoder);

// ------------------------------------------------------------------ machine state model
const STATES = {
  RUNNING:     { color: 0x22c55e, lamp: 'Green' },
  IDLE:        { color: 0xf59e0b, lamp: 'Amber' },
  STOPPED:     { color: 0xef4444, lamp: 'Red' },
  ALARM:       { color: 0xef4444, lamp: 'Red', blink: true },
  MAINTENANCE: { color: 0x2f80ed, lamp: 'Amber', blink: true },
  OFFLINE:     { color: 0x8a9096, lamp: null },
};
const LAMP_COLORS = { Green: 0x22c55e, Amber: 0xf59e0b, Red: 0xef4444 };
// materials that must be unique per machine instance (everything else stays shared)
const PER_INSTANCE = /^MAT_(Lamp_|Status_Ring|Sensor_LED|HMI_Screen|Heater_)/;
const IMM_ZONES = ['Nozzle', 'Z1', 'Z2', 'Z3', 'Z4', 'Z5'];
const IMM_SETPOINTS = { Nozzle: 220, Z1: 215, Z2: 210, Z3: 205, Z4: 195, Z5: 60 };
const C_COLD = new THREE.Color(0x7a7f85), C_WARM = new THREE.Color(0xf59e0b), C_HOT = new THREE.Color(0xef4444);
const heatColor = (t, out) => {
  const k = THREE.MathUtils.clamp((t - 40) / 220, 0, 1);
  return k < 0.5 ? out.lerpColors(C_COLD, C_WARM, k / 0.5) : out.lerpColors(C_WARM, C_HOT, (k - 0.5) / 0.5);
};
const ease = (cur, tgt, k) => cur + (tgt - cur) * k;
let shadowRefresh = 0;   // seconds of shadow-map refresh still pending

class Machine {
  constructor(def, template, index) {
    this.id = def.id;
    this.type = def.type;
    this.p = def.type === 'cnc' ? 'CNC_' : 'IMM_';
    this.root = template.clone(true);              // geometry + static materials shared with the template
    this.root.name = def.id;
    this.root.position.fromArray(def.position);
    this.root.rotation.y = THREE.MathUtils.degToRad(def.rotationY || 0);
    this.root.userData.machineId = def.id;
    this.root.userData.machineType = def.type;
    this.nodes = {};
    const cache = new Map();
    this.root.traverse((o) => {
      if (o.name) this.nodes[o.name] = o;
      if (!o.isMesh) return;
      if (PER_INSTANCE.test(o.material.name)) {
        if (!cache.has(o.material)) cache.set(o.material, o.material.clone());
        o.material = cache.get(o.material);
      }
      if (!o.geometry.boundingSphere) o.geometry.computeBoundingSphere();
      o.castShadow = o.geometry.boundingSphere.radius > 0.12 && !/Glass|StatusRing/.test(o.name);
      o.receiveShadow = true;
    });
    this.rest = {};
    for (const n of Object.values(this.nodes)) if (n.userData.dir_gltf) this.rest[n.name] = n.position.clone();
    this.ring = this.nodes[this.p + 'StatusRing']?.material;
    this.lamps = {};
    for (const l of ['Green', 'Amber', 'Red']) this.lamps[l] = this.nodes[this.p + 'StackLight_' + l]?.material;
    this.heaters = {};
    if (this.type === 'imm') this.root.traverse((o) => {
      const m = o.isMesh && o.material.name.match(/^MAT_Heater_(\w+)$/);
      if (m) { this.heaters[m[1]] = o.material; o.material.metalness = 0.25; o.material.roughness = 0.45; }
    });
    this.t = index * 2.7;                           // phase offset so machines do not move in sync
    this.cur = { x: 0, y: 0, z: 0, door: 1, clamp: 0, carriage: 0, gate: 1 };
    this.tgt = { ...this.cur };
    this.live = { rpm: 8000, shots: 1200 + index * 317, phase: 'COOL', partVisible: true,
                  temps: { ...IMM_SETPOINTS } };
    this.external = false;                          // true once real data drives motion
    this.highlight = false;
    this.cycle = 12;                                // IMM cycle period (s); apply({ cycleTime }) sets the real one
    this.u = 0;                                     // position inside the current cycle, 0..1
    this.operator = null;                           // Operator while a job card with an operator is running
    this.screen = this.makeScreen();
    this.setState(def.state || 'IDLE');
    this.root.updateMatrixWorld(true);
    this.box = new THREE.Box3().setFromObject(this.root);
  }

  makeScreen() {
    const mesh = this.nodes[this.p + 'HMI_Screen'];
    if (!mesh) return null;
    const canvas = document.createElement('canvas');
    canvas.width = 320; canvas.height = Math.round(320 / (mesh.userData.aspect || 1.3));
    const tex = new THREE.CanvasTexture(canvas);
    tex.flipY = false;
    tex.colorSpace = THREE.SRGBColorSpace;
    const mat = mesh.material.clone();
    mat.color.set(0x000000); mat.emissive.set(0xffffff); mat.emissiveMap = tex; mat.emissiveIntensity = 1;
    mesh.material = mat;
    return { canvas, ctx: canvas.getContext('2d'), tex, timer: Math.random() };
  }

  drawScreen() {
    const s = this.screen; if (!s) return;
    const { ctx, canvas } = s, w = canvas.width, h = canvas.height;
    ctx.fillStyle = '#0d1217'; ctx.fillRect(0, 0, w, h);
    if (this.state === 'OFFLINE') { s.tex.needsUpdate = true; return; }
    ctx.fillStyle = '#' + STATES[this.state].color.toString(16).padStart(6, '0');
    ctx.fillRect(0, 0, w, 44);
    ctx.fillStyle = '#0d1217'; ctx.font = 'bold 24px system-ui, sans-serif';
    ctx.fillText(this.state, 12, 31);
    ctx.fillStyle = '#e6edf3'; ctx.font = 'bold 30px system-ui, sans-serif';
    ctx.fillText(this.id, 12, 88);
    ctx.font = '20px ui-monospace, Consolas, monospace';
    const run = this.state === 'RUNNING';
    const lines = this.type === 'cnc'
      ? [`S ${run ? this.live.rpm : 0} rpm`, `X${this.cur.x.toFixed(0)} Y${this.cur.y.toFixed(0)} Z${this.cur.z.toFixed(0)}`]
      : [`${run ? this.live.phase : '-'}  #${this.live.shots}`, `N ${this.live.temps.Nozzle.toFixed(0)} C`];
    lines.forEach((t, i) => ctx.fillText(t, 12, 124 + i * 30));
    s.tex.needsUpdate = true;
  }

  setState(state) {
    if (!STATES[state] || state === this.state) return;
    this.state = state;
    const st = STATES[state];
    for (const [name, m] of Object.entries(this.lamps)) {
      if (!m) continue;
      const on = st.lamp === name;
      m.emissive.set(LAMP_COLORS[name]);
      m.emissiveIntensity = on ? 3 : 0;
      m.color.set(LAMP_COLORS[name]).multiplyScalar(on ? 1 : 0.35);
    }
    if (this.ring) { this.ring.color.set(st.color); this.ring.emissive.set(st.color); }
    this.tgt.door = state === 'MAINTENANCE' ? 0 : 1;     // CNC doors open for maintenance
    this.tgt.gate = state === 'MAINTENANCE' ? 0 : 1;     // IMM safety gate open for maintenance
    shadowRefresh = 2;
    if (this.screen) this.drawScreen();
  }

  apply(p = {}) {
    if (p.state) this.setState(p.state);
    const motion = ['axes', 'clamp_mm', 'carriage_mm', 'door', 'gate'].some(k => p[k] !== undefined);
    if (motion) this.external = true;
    const clampT = (name, v) => { const t = this.nodes[name]?.userData.travel_mm; return t ? Math.min(t[1], Math.max(t[0], v)) : v; };
    if (p.axes) for (const k of ['x', 'y', 'z'])
      if (typeof p.axes[k] === 'number') this.tgt[k] = clampT('CNC_Axis_' + k.toUpperCase(), p.axes[k]);
    if (typeof p.door === 'boolean') { this.tgt.door = p.door ? 1 : 0; shadowRefresh = 2; }
    if (typeof p.gate === 'boolean') { this.tgt.gate = p.gate ? 1 : 0; shadowRefresh = 2; }
    if (typeof p.clamp_mm === 'number') this.tgt.clamp = clampT('IMM_Axis_Clamp', p.clamp_mm);
    if (typeof p.carriage_mm === 'number') this.tgt.carriage = clampT('IMM_Axis_Carriage', p.carriage_mm);
    if (typeof p.rpm === 'number') this.live.rpm = p.rpm;
    if (p.temps) Object.assign(this.live.temps, p.temps);
    if (typeof p.shotCount === 'number') this.live.shots = p.shotCount;
    if (p.phase) this.live.phase = p.phase;
    if (typeof p.partVisible === 'boolean') this.live.partVisible = p.partVisible;
    if (typeof p.cycleTime === 'number' && p.cycleTime > 0) this.cycle = THREE.MathUtils.clamp(p.cycleTime, 8, 60);
  }

  move(name, mm) {
    const n = this.nodes[name], r = this.rest[name];
    if (!n || !r) return;
    const d = n.userData.dir_gltf;
    n.position.set(r.x + d[0] * mm / 1000, r.y + d[1] * mm / 1000, r.z + d[2] * mm / 1000);
  }

  simulate(dt) {
    if (this.state !== 'RUNNING' || this.external || !SIMULATE) return;
    this.t += dt;
    const t = this.t;
    if (this.type === 'cnc') {
      this.tgt.x = 150 * Math.sin(t * 0.35);
      this.tgt.y = 100 * Math.sin(t * 0.22 + 1);
      this.tgt.z = 40 + 30 * Math.sin(t * 0.5);
    } else {
      const P = this.cycle, s = P / 12, c = t % P;  // phases keep their 12 s proportions at any cycle time
      if (c < this.prevCycle) this.live.shots++;
      this.prevCycle = c;
      this.u = c / P;
      const phase = c < 1.5 * s ? 'CLOSE' : c < 3 * s ? 'INJECT' : c < 8 * s ? 'COOL'
        : c < 9.5 * s ? 'OPEN' : c < 10.5 * s ? 'EJECT' : 'REMOVE';
      this.live.phase = phase;
      this.tgt.clamp = ['OPEN', 'EJECT', 'REMOVE'].includes(phase) ? 400 : 0;
      this.tgt.carriage = phase === 'INJECT' || phase === 'COOL' ? 0 : 60;
      this.live.partVisible = phase !== 'REMOVE';
      if (this.operator) {                          // the operator opens the gate and takes the part out by hand
        const gate = this.u >= 0.8 && this.u < 0.955 ? 0 : 1;
        if (gate !== this.tgt.gate) { this.tgt.gate = gate; shadowRefresh = Math.max(shadowRefresh, 1.2); }
        this.live.partVisible = this.u < 0.915;
      }
    }
  }

  update(dt, now) {
    this.simulate(dt);
    const k = 1 - Math.exp(-dt * 5);
    for (const a of Object.keys(this.cur)) this.cur[a] = ease(this.cur[a], this.tgt[a], k);
    if (this.type === 'cnc') {
      this.move('CNC_Axis_X', this.cur.x);
      this.move('CNC_Axis_Y', this.cur.y);
      this.move('CNC_Axis_Z', this.cur.z);
      const open = (1 - this.cur.door) * (this.nodes.CNC_Door?.userData.open_offset_mm || 0);
      this.move('CNC_Door_Left', open);
      this.move('CNC_Door_Right', open);
      if (this.state === 'RUNNING') this.nodes.CNC_Spindle.rotation.y += Math.min(this.live.rpm, 240) / 60 * Math.PI * 2 * dt;
    } else {
      this.move('IMM_Axis_Clamp', this.cur.clamp);
      this.move('IMM_Axis_Carriage', this.cur.carriage);
      this.move('IMM_SafetyGate', (1 - this.cur.gate) * (this.nodes.IMM_SafetyGate?.userData.open_offset_mm || 0));
      if (this.nodes.IMM_MouldedPart) this.nodes.IMM_MouldedPart.visible = this.live.partVisible;
      // heaters: drift toward setpoint when powered, cool down when offline
      const kt = 1 - Math.exp(-dt * 0.15);
      for (const z of IMM_ZONES) {
        if (!this.external) {
          const goal = this.state === 'OFFLINE' ? 30 : this.state === 'STOPPED' ? IMM_SETPOINTS[z] - 25 : IMM_SETPOINTS[z];
          this.live.temps[z] = ease(this.live.temps[z], goal, kt);
        }
        const m = this.heaters[z];
        if (!m) continue;
        heatColor(this.live.temps[z], m.color);
        m.emissive.copy(m.color);
        m.emissiveIntensity = THREE.MathUtils.clamp((this.live.temps[z] - 120) / 140, 0, 1) * 0.6;
      }
    }
    const st = STATES[this.state];
    if (st.blink && this.lamps[st.lamp]) this.lamps[st.lamp].emissiveIntensity = (now % 900) < 450 ? 3 : 0.2;
    if (this.ring) this.ring.emissiveIntensity = this.highlight ? 2 + 2.5 * (0.5 + 0.5 * Math.sin(now / 160)) : 2;
    if (this.screen && (this.screen.timer += dt) > 0.5) { this.screen.timer = 0; this.drawScreen(); }
    if (this.operator) this.operator.update(dt, now);
  }
}

// ------------------------------------------------------------------ operators
// One low-poly operator per machine whose job card is running with an operator (host: setOperator).
// IMM: opens the safety gate, takes the moulded part out and drops it into a parts bin, in step with the
// moulding cycle. CNC: stands at the HMI panel and presses buttons now and then. Geometries and materials
// are shared by all operators; no castShadow (a blob shadow sits under the feet instead).
const OP_MAT = {}, OP_GEO = {};
const opMat = (key, color, extra = {}) =>
  (OP_MAT[key] ??= new THREE.MeshStandardMaterial({ color, roughness: 0.7, metalness: 0, ...extra }));
const opGeo = (key, make) => (OP_GEO[key] ??= make());
const opBlobMat = new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.2, depthWrite: false });
const sstep = (a, b, x) => { const t = THREE.MathUtils.clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const angleTo = (from, to) => from + Math.atan2(Math.sin(to - from), Math.cos(to - from));

function buildOperatorBody() {
  const M = {
    shoe: opMat('shoe', 0x1b1d21), pants: opMat('pants', 0x2c333d), shirt: opMat('shirt', 0x22324d),
    vest: opMat('vest', 0xf58120, { roughness: 0.55 }),
    stripe: opMat('stripe', 0xe3e7ec, { metalness: 0.5, roughness: 0.3, emissive: 0x777777, emissiveIntensity: 0.3 }),
    skin: opMat('skin', 0xd9a27b), hat: opMat('hat', 0xf4f4f1, { roughness: 0.35 }),
    dark: opMat('glasses', 0x101418, { roughness: 0.2, metalness: 0.4 }),
  };
  const mesh = (key, make, mat, x = 0, y = 0, z = 0) => {
    const m = new THREE.Mesh(opGeo(key, make), mat); m.position.set(x, y, z); return m;
  };
  const grp = (x = 0, y = 0, z = 0) => { const g = new THREE.Group(); g.position.set(x, y, z); return g; };
  const root = grp(), hips = grp(0, 0.93, 0);
  root.add(hips);
  hips.add(mesh('pelvis', () => new THREE.BoxGeometry(0.32, 0.14, 0.2), M.pants, 0, -0.02, 0));
  const spine = grp(0, 0.04, 0);
  hips.add(spine);
  const torso = mesh('torso', () => new THREE.CapsuleGeometry(0.16, 0.3, 4, 10), M.shirt, 0, 0.27, 0);
  torso.scale.set(1, 1, 0.68);
  const vest = mesh('vest', () => new THREE.CylinderGeometry(0.176, 0.166, 0.4, 14), M.vest, 0, 0.25, 0);
  vest.scale.set(1, 1, 0.72);
  spine.add(torso, vest);
  for (const y of [0.17, 0.31]) {
    const s = mesh('stripe', () => new THREE.CylinderGeometry(0.179, 0.179, 0.035, 14, 1, true), M.stripe, 0, y, 0);
    s.scale.set(1, 1, 0.73);
    spine.add(s);
  }
  const neck = grp(0, 0.5, 0);
  spine.add(neck);
  neck.add(mesh('neck', () => new THREE.CylinderGeometry(0.045, 0.05, 0.08, 8), M.skin, 0, 0.02, 0));
  const head = grp(0, 0.06, 0);
  neck.add(head);
  head.add(
    mesh('head', () => new THREE.SphereGeometry(0.1, 14, 10), M.skin, 0, 0.1, 0),
    mesh('hat', () => new THREE.SphereGeometry(0.118, 14, 8, 0, Math.PI * 2, 0, Math.PI / 2), M.hat, 0, 0.14, 0),
    mesh('brim', () => new THREE.CylinderGeometry(0.14, 0.14, 0.012, 16), M.hat, 0, 0.142, 0.012),
    mesh('glasses', () => new THREE.BoxGeometry(0.15, 0.03, 0.02), M.dark, 0, 0.115, 0.09),
  );
  const arm = (side) => {                           // side -1 = right (figure faces +Z), +1 = left
    const shoulder = grp(side * 0.205, 0.43, 0);
    spine.add(shoulder);
    shoulder.add(mesh('upperArm', () => new THREE.CapsuleGeometry(0.048, 0.2, 4, 8), M.shirt, 0, -0.13, 0));
    const elbow = grp(0, -0.27, 0);
    shoulder.add(elbow);
    elbow.add(mesh('forearm', () => new THREE.CapsuleGeometry(0.042, 0.18, 4, 8), M.shirt, 0, -0.12, 0));
    const hand = grp(0, -0.26, 0);
    elbow.add(hand);
    hand.add(mesh('hand', () => new THREE.SphereGeometry(0.048, 10, 8), M.skin, 0, -0.02, 0));
    return { shoulder, elbow, hand };
  };
  const leg = (side) => {
    const hip = grp(side * 0.09, -0.04, 0);
    hips.add(hip);
    hip.add(mesh('thigh', () => new THREE.CapsuleGeometry(0.068, 0.28, 4, 8), M.pants, 0, -0.2, 0));
    const knee = grp(0, -0.42, 0);
    hip.add(knee);
    knee.add(
      mesh('shin', () => new THREE.CapsuleGeometry(0.058, 0.3, 4, 8), M.pants, 0, -0.21, 0),
      mesh('shoe', () => new THREE.BoxGeometry(0.11, 0.08, 0.26), M.shoe, 0, -0.44, 0.05),
    );
    return { hip, knee };
  };
  const blob = new THREE.Mesh(opGeo('blob', () => new THREE.CircleGeometry(0.34, 20)), opBlobMat);
  blob.rotation.x = -Math.PI / 2;
  blob.position.y = 0.008;
  root.add(blob);
  return { root, hips, spine, head, rArm: arm(-1), lArm: arm(1), rLeg: leg(-1), lLeg: leg(1) };
}

function buildBin() {
  const mat = opMat('bin', 0x1f6fd1, { roughness: 0.5 });
  const W = 0.6, D = 0.42, H = 0.34, T = 0.02;
  const bin = new THREE.Group();
  for (const [w, h, d, x, y, z] of [[W, T, D, 0, T / 2, 0], [W, H, T, 0, H / 2, -D / 2], [W, H, T, 0, H / 2, D / 2],
    [T, H, D, -W / 2, H / 2, 0], [T, H, D, W / 2, H / 2, 0]]) {
    const m = new THREE.Mesh(opGeo(`bin${w}${h}${d}`, () => new THREE.BoxGeometry(w, h, d)), mat);
    m.position.set(x, y, z);
    bin.add(m);
  }
  const blob = new THREE.Mesh(opGeo('binBlob', () => new THREE.PlaneGeometry(0.75, 0.56)), opBlobMat);
  blob.rotation.x = -Math.PI / 2;
  blob.position.y = 0.006;
  bin.add(blob);
  return bin;
}

/** A centred copy of the moulded part, scaled so its longest side is at most `maxSize` metres. */
function partCopy(src, maxSize) {
  const wrap = new THREE.Group(), part = src.clone(true);
  part.position.set(0, 0, 0);
  part.visible = true;
  wrap.add(part);
  wrap.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(part);
  part.position.sub(box.getCenter(new THREE.Vector3()));
  wrap.scale.setScalar(Math.min(1, maxSize / Math.max(...box.getSize(new THREE.Vector3()).toArray(), 1e-3)));
  return wrap;
}

const POSE_KEYS = ['x', 'z', 'yaw', 'lean', 'twist', 'rFwd', 'rSide', 'rElb', 'lFwd', 'lSide', 'lElb', 'headYaw', 'headPitch'];

class Operator {
  constructor(machine, name) {
    this.m = machine;
    this.name = name;
    Object.assign(this, buildOperatorBody());
    const root = machine.root, origin = root.position;   // layout machines are not rotated: local = world - origin
    root.updateMatrixWorld(true);
    this.yawHome = Math.PI;                          // face the machine (its front is +Z)
    if (machine.type === 'imm' && machine.nodes.IMM_SafetyGate) {
      const gate = machine.nodes.IMM_SafetyGate;
      const gb = new THREE.Box3().setFromObject(gate);
      const mould = machine.nodes.IMM_MouldedPart ?? machine.nodes.IMM_Mould_Moving;   // stand in front of the mould
      const mx = mould ? new THREE.Box3().setFromObject(mould).getCenter(new THREE.Vector3()).x : (gb.min.x + gb.max.x) / 2;
      this.home = new THREE.Vector3(mx - origin.x, 0, gb.max.z - origin.z + 0.62);
      this.gateSign = Math.sign(gate.userData.dir_gltf?.[0] ?? 1) || 1;
      this.binSide = -this.gateSign;                 // bin on the side the gate does not slide to
      this.bin = buildBin();
      this.bin.position.set(this.home.x + this.binSide * 1.05, 0, this.home.z + 0.05);
      root.add(this.bin);
      const src = machine.nodes.IMM_MouldedPart;
      if (src) {
        this.part = partCopy(src, 0.2);
        this.part.position.set(0.11, -0.07, 0.04);   // between the hands, held by the right one
        this.part.visible = false;
        this.rArm.hand.add(this.part);
        this.pile = Array.from({ length: 8 }, (_, i) => {
          const p = partCopy(src, 0.15);
          p.position.set(((i % 3) - 1) * 0.15, 0.07 + Math.floor(i / 3) * 0.045, ((i % 2) - 0.5) * 0.13);
          p.rotation.set(0.3 * (i % 2), i * 1.37, 0.2 * ((i + 1) % 2));
          p.visible = false;
          this.bin.add(p);
          return p;
        });
      }
      const hmi = machine.nodes.IMM_HMI_Screen;
      this.hmiSide = hmi ? Math.sign(new THREE.Box3().setFromObject(hmi).getCenter(new THREE.Vector3()).x - origin.x - this.home.x) || 1 : 1;
    } else {
      const hmi = machine.nodes.CNC_HMI_Screen;
      const hc = hmi ? new THREE.Box3().setFromObject(hmi).getCenter(new THREE.Vector3()).sub(origin) : new THREE.Vector3(0.8, 0, 0);
      this.home = new THREE.Vector3(hc.x - 0.1, 0, machine.box.max.z - origin.z + 0.5);
      this.hmiSide = 1;
    }
    this.cur = Object.fromEntries(POSE_KEYS.map((k) => [k, 0]));
    this.cur.yaw = this.yawHome;
    this.tgt = { ...this.cur };
    this.carrying = false;
    this.binCount = 0;
    this.walk = 0;
    this.seed = Math.random() * 1000;
    root.add(this.root);
    this.apply(1);
  }

  restPose(T, now) {
    const st = this.m.state, n = now / 1000 + this.seed;
    Object.assign(T, { x: 0, z: 0, yaw: this.yawHome, lean: 0.04, twist: 0, rFwd: 0.12, rSide: 0.06, rElb: 0.25,
      lFwd: 0.12, lSide: 0.06, lElb: 0.25, headYaw: 0.35 * Math.sin(n * 0.4), headPitch: 0 });
    if (this.carrying) Object.assign(T, { rFwd: 0.7, rElb: 1.3, lFwd: 0.7, lElb: 1.3, rSide: -0.12, lSide: -0.12 });
    if (st === 'ALARM' || st === 'STOPPED') Object.assign(T, { headPitch: -0.35, headYaw: 0, rFwd: 0.25, rSide: 0.55, rElb: 1.7 });
    if (st === 'MAINTENANCE') Object.assign(T, { x: (this.binSide ?? 1) * 1.5, z: 0.2 });
  }

  immPose(T, now) {
    const m = this.m, u = m.u, g = this.gateSign, b = this.binSide;
    const binYaw = b > 0 ? Math.PI / 2 : -Math.PI / 2;
    this.restPose(T, now);
    T.headYaw = 0;
    const carry = () => Object.assign(T, { rFwd: 0.7, rElb: 1.3, lFwd: 0.7, lElb: 1.3, rSide: -0.12, lSide: -0.12 });
    // take the part (REMOVE) and drop it in the bin (next CLOSE / INJECT)
    if (u >= 0.915 && u < 0.99 && !this.carrying) { this.carrying = true; if (this.part) this.part.visible = true; }
    if (u >= 0.11 && u < 0.5 && this.carrying) {
      this.carrying = false;
      if (this.part) this.part.visible = false;
      if (this.pile) {
        if (this.binCount % this.pile.length === 0) for (const p of this.pile) p.visible = false;
        this.pile[this.binCount % this.pile.length].visible = true;
        this.binCount++;
      }
    }
    if (u < 0.05) {                                  // turn and step to the bin, part in hands
      carry(); Object.assign(T, { yaw: binYaw, x: b * 0.42 });
    } else if (u < 0.15) {                           // bend and drop the part into the bin
      Object.assign(T, { yaw: binYaw, x: b * 0.42, lean: 0.5, rFwd: 0.95, rElb: 0.2, lFwd: 0.95, lElb: 0.2, rSide: -0.1, lSide: -0.1 });
    } else if (u < 0.22) {                           // straighten up at the bin
      Object.assign(T, { yaw: binYaw, x: b * 0.42 });
    } else if (u < 0.32) {                           // walk back to the gate
      Object.assign(T, { x: 0 });
    } else if (u < 0.667) {                          // wait; glance at the HMI now and then
      T.headYaw = u > 0.42 && u < 0.52 ? -this.hmiSide * 0.65 : 0.12 * Math.sin(now / 1500 + this.seed);
    } else if (u < 0.78) {                           // mould opening: get ready
      Object.assign(T, { lean: 0.08, rFwd: 0.4, rElb: 0.5 });
    } else if (u < 0.875) {                          // slide the safety gate open, walking with it
      Object.assign(T, { x: g * 0.38 * sstep(0.8, 0.87, u), lean: 0.15, rFwd: 1.25, rElb: 0.3, rSide: -0.1, twist: -g * 0.15 });
    } else if (u < 0.915) {                          // lean in and reach into the mould
      Object.assign(T, { x: 0, z: -0.22, lean: 0.45, rFwd: 1.45, rElb: 0.15, lFwd: 1.45, lElb: 0.15, rSide: -0.14, lSide: -0.14 });
    } else if (u < 0.945) {                          // pull the part out
      carry(); Object.assign(T, { z: 0, lean: 0.12 });
    } else {                                         // close the gate with the free hand, part in the other
      carry(); Object.assign(T, { x: g * 0.32 * (1 - sstep(0.955, 0.995, u)), lFwd: 1.2, lElb: 0.3, twist: -g * 0.12 });
    }
  }

  cncPose(T, now) {
    this.restPose(T, now);
    const n = (now / 1000 + this.seed) % 7.5;
    T.headYaw = n > 4 && n < 5.5 ? -0.45 : 0.1 * Math.sin(now / 1700);   // look through the door window
    if (n < 1.3) Object.assign(T, { rFwd: 1.2, rElb: 0.65, lean: 0.12, headPitch: 0.15, headYaw: 0 });  // press the HMI
  }

  update(dt, now) {
    const T = this.tgt;
    if (this.m.state !== 'RUNNING') this.restPose(T, now);
    else if (this.m.type === 'imm' && this.bin) this.immPose(T, now);
    else this.cncPose(T, now);
    this.apply(1 - Math.exp(-dt * 8), dt, now);
  }

  apply(k, dt = 0.016, now = 0) {
    const c = this.cur, T = this.tgt, px = c.x, pz = c.z;
    for (const key of POSE_KEYS) {
      c[key] = key === 'yaw' ? c.yaw + (angleTo(c.yaw, T.yaw) - c.yaw) * k : c[key] + (T[key] - c[key]) * k;
    }
    this.root.position.set(this.home.x + c.x, 0, this.home.z + c.z);
    this.root.rotation.y = c.yaw;
    this.spine.rotation.set(c.lean + 0.012 * Math.sin(now / 650 + this.seed), c.twist, 0);
    this.rArm.shoulder.rotation.set(-c.rFwd, 0, -c.rSide);
    this.rArm.elbow.rotation.x = -c.rElb;
    this.lArm.shoulder.rotation.set(-c.lFwd, 0, c.lSide);
    this.lArm.elbow.rotation.x = -c.lElb;
    this.head.rotation.set(c.headPitch, c.headYaw, 0);
    const speed = Math.hypot(c.x - px, c.z - pz) / Math.max(dt, 1e-3);
    this.walk += dt * speed * 9;
    const amp = Math.min(speed * 0.9, 0.45), s = Math.sin(this.walk);
    this.rLeg.hip.rotation.x = s * amp;
    this.lLeg.hip.rotation.x = -s * amp;
    this.rLeg.knee.rotation.x = Math.max(0, -s) * amp * 1.4 + c.lean * 0.25;
    this.lLeg.knee.rotation.x = Math.max(0, s) * amp * 1.4 + c.lean * 0.25;
    this.rLeg.hip.rotation.x -= c.lean * 0.25;
    this.lLeg.hip.rotation.x -= c.lean * 0.25;
  }

  dispose() {
    this.root.removeFromParent();
    this.bin?.removeFromParent();
  }
}

// ------------------------------------------------------------------ load
const machines = new Map();
const machineGroup = new THREE.Group();
machineGroup.name = 'Machines';
scene.add(machineGroup);
let envRoot = null;
const loadGLB = (url) => new Promise((res, rej) => loader.load(url, res, undefined, rej));

let resolveReady;
const ready = new Promise((r) => { resolveReady = r; });

(async () => {
  const layout = await fetch(LAYOUT_URL).then((r) => r.json());
  const url = (p) => new URL(p, LAYOUT_URL).href;
  const [env, cnc, imm] = await Promise.all([
    loadGLB(url(layout.models.environment)), loadGLB(url(layout.models.cnc)), loadGLB(url(layout.models.imm))]);

  envRoot = env.scene;
  envRoot.traverse((o) => {
    if (o.isMesh) {
      o.receiveShadow = true;
      o.castShadow = /ENV_(Props|Storage|Walls)/.test(o.name) || /ENV_(Props|Storage|Walls)/.test(o.parent?.name || '');
    }
    o.matrixAutoUpdate = false;                    // static environment: skip per-frame matrix work
    o.updateMatrix();
  });
  scene.add(envRoot);

  const templates = { cnc: cnc.scene, imm: imm.scene };
  layout.machines.forEach((def, i) => {
    const m = new Machine(def, templates[def.type], i);
    machines.set(def.id, m);
    machineGroup.add(m.root);
  });

  const cam = layout.camera || {};
  camera.fov = cam.fov || 32;
  home.position.fromArray(cam.position || [-15, 19, 26]);
  home.target.fromArray(cam.target || [0, 0, 0]);
  camera.position.copy(home.position);
  controls.target.copy(home.target);
  camera.updateProjectionMatrix();
  controls.update();

  shadowRefresh = 0.1;
  document.getElementById('loading')?.remove();
  const detail = { machines: [...machines.keys()] };
  resolveReady(api);
  window.dispatchEvent(new CustomEvent('shopfloor:ready', { detail }));
})().catch((err) => {
  const el = document.getElementById('loading');
  if (el) el.textContent = 'Scene failed to load. Serve this folder over http(s), not file://';
  console.error(err);
});

// ------------------------------------------------------------------ camera moves
const home = { position: new THREE.Vector3(), target: new THREE.Vector3() };
let fly = null;   // { fromP, fromT, toP, toT, t }
function flyTo(toP, toT) {
  fly = { fromP: camera.position.clone(), fromT: controls.target.clone(), toP, toT, start: performance.now() };
}
function focus(id) {
  const m = machines.get(id);
  if (!m) return;
  const c = m.box.getCenter(new THREE.Vector3());
  const dir = camera.position.clone().sub(controls.target).normalize();
  dir.y = Math.max(dir.y, 0.45); dir.normalize();
  const size = m.box.getSize(new THREE.Vector3()).length();
  flyTo(c.clone().add(dir.multiplyScalar(size * 1.6 + 2)), c);
}
const resetView = () => flyTo(home.position.clone(), home.target.clone());

// ------------------------------------------------------------------ picking + events
const raycaster = new THREE.Raycaster(), ndc = new THREE.Vector2();
function pick(clientX, clientY) {
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set(((clientX - r.left) / r.width) * 2 - 1, -((clientY - r.top) / r.height) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const hit = raycaster.intersectObject(machineGroup, true).find((h) => h.object.visible);
  if (!hit) return null;
  let o = hit.object, part = null;
  while (o && !o.userData.machineType) {
    if (!part && o.userData.twin_role && o.userData.twin_role !== 'machine_root') part = o;
    o = o.parent;
  }
  if (!o) return null;
  return { id: o.userData.machineId, type: o.userData.machineType, part: part?.name || null,
           role: part?.userData.twin_role || null, dataTag: part?.userData.data_tag || null };
}
let downAt = null, lastHover = null, hoverQueued = null;
const el = renderer.domElement;
el.addEventListener('pointerdown', (e) => { downAt = [e.clientX, e.clientY]; });
el.addEventListener('pointerup', (e) => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 4) return;   // ignore drags
  const hit = pick(e.clientX, e.clientY);
  if (AUTO_HIGHLIGHT) highlight(hit?.id || null);
  const r = el.getBoundingClientRect();
  window.dispatchEvent(new CustomEvent('shopfloor:select', {
    detail: { ...(hit || { id: null }), x: e.clientX - r.left, y: e.clientY - r.top } }));
});
el.addEventListener('pointermove', (e) => { hoverQueued = [e.clientX, e.clientY]; });
el.addEventListener('pointerleave', () => { hoverQueued = null; });
function processHover() {
  if (!hoverQueued) return;
  const hit = pick(...hoverQueued);
  hoverQueued = null;
  el.style.cursor = hit ? 'pointer' : '';
  const key = hit ? hit.id + '|' + hit.part : null;
  if (key !== lastHover) {
    lastHover = key;
    window.dispatchEvent(new CustomEvent('shopfloor:hover', { detail: hit ? { id: hit.id, part: hit.part } : { id: null } }));
  }
}
function highlight(id) { for (const m of machines.values()) m.highlight = m.id === id; }

// ------------------------------------------------------------------ overlay anchors
const tmp = new THREE.Vector3();
function project(p) {
  tmp.set(p[0], p[1], p[2]).project(camera);
  const r = el.getBoundingClientRect();
  return { x: (tmp.x * 0.5 + 0.5) * r.width, y: (-tmp.y * 0.5 + 0.5) * r.height,
           visible: tmp.z > -1 && tmp.z < 1 && Math.abs(tmp.x) <= 1 && Math.abs(tmp.y) <= 1 };
}
function getAnchor(id) {
  const m = machines.get(id);
  if (!m) return null;
  const c = m.box.getCenter(new THREE.Vector3());
  return project([c.x, m.box.max.y + 0.4, c.z]);
}
const frameListeners = new Set();
const onFrame = (cb) => { frameListeners.add(cb); return () => frameListeners.delete(cb); };

// ------------------------------------------------------------------ postMessage bridge
window.addEventListener('message', (e) => {
  const ok = ALLOWED_ORIGINS.length ? ALLOWED_ORIGINS.includes(e.origin) : e.origin === location.origin;
  if (!ok || e.data?.type !== 'shopfloor') return;
  const list = e.data.updates || [{ id: e.data.id, payload: e.data.payload }];
  for (const u of list) machines.get(u.id)?.apply(u.payload);
});

// ------------------------------------------------------------------ loop, resize, visibility
const ro = new ResizeObserver(() => {
  const w = container.clientWidth, h = container.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
});
ro.observe(container);

let last = performance.now();
function tick(now) {
  const dt = Math.min((now - last) / 1000, 0.1); last = now;
  for (const m of machines.values()) m.update(dt, now);
  if (fly) {
    const t = Math.min((now - fly.start) / 900, 1);   // wall-clock based: same duration at any frame rate
    const k = t * t * (3 - 2 * t);
    camera.position.lerpVectors(fly.fromP, fly.toP, k);
    controls.target.lerpVectors(fly.fromT, fly.toT, k);
    if (t === 1) fly = null;
  }
  controls.update();
  processHover();
  if (shadowRefresh > 0) { renderer.shadowMap.needsUpdate = true; shadowRefresh -= dt; }
  renderer.render(scene, camera);
  for (const cb of frameListeners) cb();
}
renderer.setAnimationLoop(tick);

let visible = true, onScreen = true;
const sync = () => renderer.setAnimationLoop(visible && onScreen ? tick : null);
document.addEventListener('visibilitychange', () => { visible = !document.hidden; last = performance.now(); sync(); });
new IntersectionObserver(([e]) => { onScreen = e.isIntersecting; last = performance.now(); sync(); }).observe(container);

// ------------------------------------------------------------------ teardown
function dispose() {
  renderer.setAnimationLoop(null);
  ro.disconnect();
  controls.dispose();
  frameListeners.clear();
  scene.traverse((o) => {
    o.geometry?.dispose();                       // shared geometries: dispose() is idempotent
    for (const m of [].concat(o.material || [])) {
      for (const v of Object.values(m)) if (v?.isTexture) v.dispose();
      m.dispose();
    }
  });
  envTex.dispose();
  draco.dispose();
  renderer.dispose();
  renderer.domElement.remove();
}

/** Adds (info = { name }) or removes (null) the operator working at a machine. Idempotent. */
function setOperator(id, info) {
  const m = machines.get(id);
  if (!m) return;
  if (!info) {
    if (!m.operator) return;
    m.operator.dispose();
    m.operator = null;
    m.tgt.gate = m.state === 'MAINTENANCE' ? 0 : 1;
    return;
  }
  if (!m.operator) m.operator = new Operator(m, info.name);
  m.operator.name = info.name;
}
const opAnchor = new THREE.Vector3();
/** Screen point just above the operator's hard hat, for the host's name tag (like getAnchor). */
function getOperatorAnchor(id) {
  const op = machines.get(id)?.operator;
  if (!op) return null;
  op.head.getWorldPosition(opAnchor);
  return project([opAnchor.x, opAnchor.y + 0.42, opAnchor.z]);
}

const api = {
  ready,
  setOperator, getOperatorAnchor,
  get machines() { return [...machines.keys()]; },
  getMachine: (id) => { const m = machines.get(id); return m && { id: m.id, type: m.type, state: m.state, root: m.root, nodes: m.nodes, userData: m.root.userData }; },
  setState: (id, s) => machines.get(id)?.setState(s),
  apply: (id, p) => machines.get(id)?.apply(p),
  focus, resetView, highlight, getAnchor, project, onFrame, dispose,
  scene, camera, renderer, controls,
};
window.shopfloor = api;
</script>
</body>
</html>
