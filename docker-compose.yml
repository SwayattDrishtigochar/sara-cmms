
# SARA API + web app
# MongoDB and InfluxDB are hosted externally.
# Database credentials and application secrets are loaded from .env.

name: sara

services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile

    env_file:
      - .env

    environment:
      NODE_ENV: production
      PORT: 5080

    # Publish backend only on localhost for Apache reverse proxy.
    # It will not be directly accessible from the public network.
    ports:
      - "127.0.0.1:5080:5080"

    expose:
      - "5080"

    restart: unless-stopped
    stop_grace_period: 15s

    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        VITE_API_URL: ""
        VITE_APP_NAME: ${VITE_APP_NAME:-SARA}

    # Apache handles HTTPS and forwards requests to this port.
    ports:
      - "${WEB_PORT:-80}:80"

    restart: unless-stopped

    depends_on:
      server:
        condition: service_healthy

    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  caddy:
    profiles:
      - tls

    image: caddy:2-alpine

    ports:
      - "80:80"
      - "443:443"

    environment:
      DOMAIN: ${DOMAIN:-}

    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

    restart: unless-stopped

    depends_on:
      - client

    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

volumes:
  caddy-data: {}
  caddy-config: {}
